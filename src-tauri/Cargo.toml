[package]
name = "game-tracker"
version = "0.1.0"
description = "Track new and announced games"
authors = ["dramadanov"]
license = ""
repository = "https://github.com/dramadanov/game-tracker"
edition = "2024"
rust-version = "1.90"

[lib]
name = "game_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
